# Sustituye profesor.example.com por el dominio real antes de copiarlo.
# El contenedor Docker escucha únicamente en 127.0.0.1:3001.

server {
    listen 80;
    listen [::]:80;
    server_name profesor.example.com;

    # Certbot puede redirigir automáticamente a HTTPS después de obtener el certificado.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name profesor.example.com;

    ssl_certificate /etc/letsencrypt/live/profesor.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/profesor.example.com/privkey.pem;

    client_max_body_size 25m;

    # Opcional: protege el acceso con usuario/clave:
    # auth_basic "Profesor IA";
    # auth_basic_user_file /etc/nginx/.htpasswd-profesor-ia;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
