services:
  - type: web
    name: profesor-ia
    runtime: docker
    branch: main
    autoDeployTrigger: commit
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: CLIENT_ORIGINS
        value: https://profesor-ia-v3uq.onrender.com
      - key: POLLINATIONS_API_KEY
        sync: false
      - key: TRANSCRIPTION_API_KEY
        sync: false
      - key: VITE_API_BASE_URL
        value: ''
